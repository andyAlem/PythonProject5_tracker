name: CI/CD Pipeline

on:
  push:
    branches: [ feature, develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest-django

    - name: Create .env file
      run: |
        cat << EOF > .env
        SECRET_KEY=test-secret-key-for-github-actions
        NAME=test_db
        USER=postgres
        PASSWORD=postgres
        HOST=localhost
        PORT=5432
        TELEGRAM_BOT_TOKEN=test-bot-token
        CELERY_BROKER_URL=redis://localhost:6379/0
        CELERY_RESULT_BACKEND=redis://localhost:6379/0
        EOF

    - name: Run linting
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run migrations
      run: |
        python manage.py migrate

    - name: Run tests
      run: |
        python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t habits-tracker .

    - name: Test Docker image
      run: |
        docker run --rm habits-tracker python -c "import django; print('Django import successful')"

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature' || github.ref == 'refs/heads/develop'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          script: |
          # Создание директории и клонирование проекта если его нет
          if [ ! -d "/home/${{ secrets.USERNAME }}/habits-tracker" ]; then
            cd /home/${{ secrets.USERNAME }}
            git clone https://github.com/andyAlem/PythonProject5_tracker.git habits-tracker
          fi
          
          cd /home/${{ secrets.USERNAME }}/habits-tracker
          
          # Остановка и удаление старых контейнеров
          docker-compose down || true
          
          # Обновление кода
          git pull origin feature
          
          # Создание .env файла из секретов
          cat << EOF > .env
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}
          CELERY_RESULT_BACKEND=${{ secrets.CELERY_RESULT_BACKEND }}
          NAME=${{ secrets.NAME }}
          USER=${{ secrets.USER }}
          PASSWORD=${{ secrets.PASSWORD }}
          HOST=${{ secrets.HOST }}
          PORT=${{ secrets.PORT }}
          EOF
          
          # Пересборка и запуск контейнеров
          docker-compose build --no-cache
          docker-compose up -d
          
          # Очистка неиспользуемых образов
          docker system prune -f