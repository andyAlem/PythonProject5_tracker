name: CI/CD Pipeline

on:
  push:
    branches: [feature, develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest-django

      - name: Create .env file
        run: |
          echo "SECRET_KEY=test-secret-key-for-github-actions" >> .env
          echo "NAME=test_db" >> .env
          echo "USER=postgres" >> .env
          echo "PASSWORD=postgres" >> .env
          echo "HOST=localhost" >> .env
          echo "PORT=5432" >> .env
          echo "TELEGRAM_BOT_TOKEN=test-bot-token" >> .env
          echo "CELERY_BROKER_URL=redis://localhost:6379/0" >> .env
          echo "CELERY_RESULT_BACKEND=redis://localhost:6379/0" >> .env

      - name: Run linting
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t habits-tracker .

      - name: Test Docker image
        run: docker run --rm habits-tracker python -c "import django; print('Django import successful')"

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/feature') || startsWith(github.ref, 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write SSH key to file
        run: |
          echo -e "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.USERNAME }}
          key_path: key.pem
          script: |
            cd /home/${{ secrets.USERNAME }}
            if [ ! -d "habits-tracker" ]; then
              git clone https://github.com/andyAlem/PythonProject5_tracker.git habits-tracker
            fi
            cd habits-tracker
            docker-compose down || true
            git pull origin $(git rev-parse --abbrev-ref HEAD)
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
            echo "CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}" >> .env
            echo "CELERY_RESULT_BACKEND=${{ secrets.CELERY_RESULT_BACKEND }}" >> .env
            echo "NAME=${{ secrets.NAME }}" >> .env
            echo "USER=${{ secrets.USER }}" >> .env
            echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
            echo "HOST=${{ secrets.HOST }}" >> .env
            echo "PORT=${{ secrets.PORT }}" >> .env
            docker-compose build --no-cache
            docker-compose up -d
            docker image prune -f
